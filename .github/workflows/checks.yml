name: CI
on: [pull_request]
env:
  TURBO_TEAM: codesandbox
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v4

      - name: Setup | Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "yarn"

      - name: Setup | Install dependencies
        run: yarn install --prefer-offline

      - name: Test | Jest
        run: yarn test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v4

      - name: Setup | Node.js
        # v2 -> v4: the v2 action's yarn-cache integration dies on the current
        # runners ("Cache service responded with 400" before eslint ever runs —
        # PR #31's Lint leg 2026-09-13 and this item's own fault-injection run
        # 2026-09-19). The test/format jobs already run v4. Without this the lint
        # gate never reaches eslint, and a gate that dies in setup never gates.
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "yarn"

      - name: Setup | Install dependencies
        run: yarn install --prefer-offline

      - name: Lint | Eslint
        run: yarn lint

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v4

      - name: Setup | Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "yarn"

      - name: Setup | Install dependencies
        run: yarn install --prefer-offline

      - name: Format
        run: yarn format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v4

      - name: Setup | Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "yarn"

      - name: Setup | Install dependencies
        run: yarn install --prefer-offline

      - name: Typecheck
        run: yarn typecheck
